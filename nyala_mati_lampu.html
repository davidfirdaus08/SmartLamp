<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Lamp Control</title>
<!-- Font Awesome untuk Ikon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    /* --- TEMA TERANG (Default) --- */
    --bg-color: #eef2f5;
    --card-bg: #ffffff;
    --text-main: #333333;
    --text-sub: #888888;
    --primary-on: #ff9f43;
    --primary-off: #a4b0be;
    --shadow-light: #ffffff;
    --shadow-dark: #d1d9e6;
  }

  /* --- TEMA GELAP (Dark Mode) --- */
  [data-theme="dark"] {
    --bg-color: #2d3436;      
    --card-bg: #2d3436;       
    --text-main: #dfe6e9;     
    --text-sub: #b2bec3;      
    --primary-on: #ff9f43;
    --primary-off: #636e72;
    --shadow-light: #353b48;  
    --shadow-dark: #1e272e;   
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-color);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-main);
    transition: background 0.3s ease;
  }

  .container {
    width: 100%;
    max-width: 320px;
    padding: 20px;
    position: relative;
  }

  .card {
    background: var(--card-bg);
    border-radius: 30px;
    padding: 40px 30px;
    box-shadow: 
      10px 10px 20px var(--shadow-dark), 
      -10px -10px 20px var(--shadow-light);
    text-align: center;
    display: flex; 
    flex-direction: column;
    transition: all 0.3s ease;
  }

  /* --- Tombol Toggle Dark Mode --- */
  .theme-toggle {
    position: absolute;
    top: 0;
    right: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--card-bg);
    color: var(--text-sub);
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 
      5px 5px 10px var(--shadow-dark), 
      -5px -5px 10px var(--shadow-light);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    z-index: 10;
  }

  .theme-toggle:active {
    box-shadow: 
      inset 3px 3px 6px var(--shadow-dark), 
      inset -3px -3px 6px var(--shadow-light);
    transform: scale(0.95);
  }

  /* --- Header --- */
  .header {
    margin-bottom: 20px;
    margin-top: 10px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 5px;
    letter-spacing: 1px;
  }

  p.subtitle {
    font-size: 0.9rem;
    color: var(--text-sub);
  }

  /* --- Ikon Lampu --- */
  .lamp-icon-wrapper {
    position: relative;
    width: 120px;
    height: 120px;
    margin: 0 auto 30px;
    border-radius: 50%;
    background: var(--bg-color);
    box-shadow: 
      5px 5px 10px var(--shadow-dark), 
      -5px -5px 10px var(--shadow-light);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.5s ease;
  }

  .card[data-state="on"] .lamp-icon-wrapper {
    box-shadow: 
      inset 5px 5px 10px rgba(0,0,0,0.1), 
      inset -5px -5px 10px rgba(255,255,255,0.5),
      0 0 30px rgba(255, 159, 67, 0.6);
    background: linear-gradient(145deg, #fff5e6, #ffe0b2);
  }

  .lamp-svg {
    width: 60px;
    height: 60px;
    fill: var(--primary-off);
    transition: fill 0.4s ease, filter 0.4s ease;
  }

  .card[data-state="on"] .lamp-svg {
    fill: var(--primary-on);
    filter: drop-shadow(0 0 8px var(--primary-on));
  }

  /* --- Badge Status --- */
  .control-panel {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 20px;
  }

  .status-badge {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 15px;
    transition: all 0.3s ease;
  }
  
  .card[data-state="on"] .status-badge {
    background: rgba(255, 159, 67, 0.15);
    color: #e67e22;
  }
  
  .card[data-state="off"] .status-badge {
    background: rgba(0,0,0,0.05);
    color: var(--text-sub);
  }

  /* --- Tombol Kontrol --- */
  .action-btn {
    background: var(--bg-color);
    border: none;
    width: 100%;
    padding: 18px;
    border-radius: 15px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-main);
    cursor: pointer;
    box-shadow: 
      6px 6px 12px var(--shadow-dark), 
      -6px -6px 12px var(--shadow-light);
    transition: all 0.2s ease;
    outline: none;
    text-decoration: none;
    display: block;
  }

  .action-btn:active {
    box-shadow: 
      inset 4px 4px 8px var(--shadow-dark), 
      inset -4px -4px 8px var(--shadow-light);
    transform: translateY(2px);
  }

  .card[data-state="on"] .action-btn {
    color: #d35400;
  }
  
  .card[data-state="off"] .action-btn {
    color: var(--text-sub);
  }

  /* --- Footer Sosmed --- */
  .social-footer {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid rgba(0,0,0,0.05);
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  .social-link {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: var(--bg-color);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--text-sub);
    font-size: 1.2rem;
    box-shadow: 
      5px 5px 10px var(--shadow-dark), 
      -5px -5px 10px var(--shadow-light);
    transition: all 0.3s ease;
  }

  .social-link:active {
    box-shadow: 
      inset 3px 3px 6px var(--shadow-dark), 
      inset -3px -3px 6px var(--shadow-light);
    transform: scale(0.95);
  }

  .social-link:hover.youtube {
    color: #ff0000;
    box-shadow: 
      5px 5px 10px var(--shadow-dark), 
      -5px -5px 10px var(--shadow-light),
      0 0 15px rgba(255, 0, 0, 0.3);
  }

  .social-link:hover.instagram {
    color: #e1306c;
    box-shadow: 
      5px 5px 10px var(--shadow-dark), 
      -5px -5px 10px var(--shadow-light),
      0 0 15px rgba(225, 48, 108, 0.3);
  }

</style>
</head>
<body>

<div class="container">
  <!-- Tombol Ganti Tema -->
  <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">
    <i class="fas fa-moon"></i>
  </button>

  <!-- Card Utama -->
  <div class="card" id="ui-card" data-state="off">
    
    <div class="header">
      <!-- Teks Greeting akan muncul di sini -->
      <h1 id="greeting-text">Selamat Malam</h1>
      <p class="subtitle">Kontrol Wi-Fi</p>
    </div>

    <div class="lamp-icon-wrapper">
      <svg class="lamp-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12,2A7,7,0,0,0,5,9c0,2.38,1.19,4.47,3,5.74V17a1,1,0,0,0,1,1h6a1,1,0,0,0,1-1V14.74C17.81,13.47,19,11.38,19,9A7,7,0,0,0,12,2ZM14,19H10V18h4Zm0-5.55V16H10V13.45C8.25,12.53,7,10.68,7,9a5,5,0,0,1,10,0C17,10.68,15.75,12.53,14,13.45Z"/>
        <path d="M9,21a1,1,0,0,0,1,1h4a1,1,0,0,0,0-2H10A1,1,0,0,0,9,21Z"/>
      </svg>
    </div>

    <div class="status-text">
      <span class="status-badge">Lampu Mati</span>
    </div>

    <div class="control-panel">
      <a href="/on" class="action-btn" onclick="toggleLamp(event, this)">NYALAKAN</a>
    </div>

    <div class="social-footer">
      <a href="https://youtube.com/@virlanhakuto" target="_blank" class="social-link youtube" title="Youtube">
        <i class="fab fa-youtube"></i>
      </a>
      <a href="https://instagram.com/davidfirdaus_08" target="_blank" class="social-link instagram" title="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
    </div>

  </div>
</div>

<script>
  // --- LOGIKA DARK MODE ---
  function toggleTheme() {
    const html = document.documentElement;
    const btn = document.getElementById('theme-btn');
    const currentTheme = html.getAttribute('data-theme');
    
    if (currentTheme === 'dark') {
      html.removeAttribute('data-theme');
      btn.innerHTML = '<i class="fas fa-moon"></i>';
    } else {
      html.setAttribute('data-theme', 'dark');
      btn.innerHTML = '<i class="fas fa-sun"></i>';
    }
  }

  // --- LOGIKA SAPAAN WAKTU ---
  function setGreeting() {
    const hour = new Date().getHours();
    const greetingElement = document.getElementById('greeting-text');
    let text = "DF SMART LAMP"; // Default
    
    if (hour >= 5 && hour < 11) text = "Selamat Pagi";
    else if (hour >= 11 && hour < 15) text = "Selamat Siang";
    else if (hour >= 15 && hour < 18) text = "Selamat Sore";
    else text = "Selamat Malam";
    
    greetingElement.textContent = text;
  }

  // Jalankan saat halaman dimuat
  setGreeting();

  // --- LOGIKA KONTROL LAMPU ---
  function toggleLamp(e, element) {
    e.preventDefault();
    
    var url = element.getAttribute('href');
    var card = document.getElementById('ui-card');
    var statusBadge = document.querySelector('.status-badge');
    var actionBtn = document.querySelector('.action-btn');
    var isTurningOn = (url === '/on');

    if (isTurningOn) {
      card.setAttribute('data-state', 'on');
      statusBadge.textContent = "Lampu Menyala";
      actionBtn.textContent = "MATIKAN";
      actionBtn.setAttribute('href', '/off');
    } else {
      card.setAttribute('data-state', 'off');
      statusBadge.textContent = "Lampu Mati";
      actionBtn.textContent = "NYALAKAN";
      actionBtn.setAttribute('href', '/on');
    }

    // Simulasi kirim data ke ESP8266
    fetch(url).then(response => {
      if(!response.ok) {
        console.log("Status update sent (Simulation)");
      }
    }).catch(error => {
      // Abaikan error ini saat tes di browser
      console.log("Preview Mode: Perintah dikirim ke " + url);
    });
  }
</script>

</body>
</html>
